# Mounted explicitly rather than patched in at runtime, so the replication
# grant is visible in the repository instead of hidden inside an init script.
#
# The default postgres image ships no `replication` line at all, which is why a
# standby can look perfectly healthy while pg_basebackup is failing in a retry
# loop. That is the same class of problem as the rest of this project: the
# container's own health check says fine, and replication is not happening.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             all                     trust

# The line the default image omits.
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    replication     all             all                     trust
